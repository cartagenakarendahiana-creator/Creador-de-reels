# Publica el editor en Firebase Hosting cada vez que se sube un cambio a esta rama.
# Necesita el secreto FIREBASE_SERVICE_ACCOUNT (ver README).
name: Publicar en Firebase
on:
  push:
    branches: [estudio-de-reels]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
