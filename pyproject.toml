[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creador-reels"
version = "0.1.0"
description = "Editor de video para reels con coherencia de habla y sonido"
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
transcripcion = ["faster-whisper>=1.0"]

[project.scripts]
creador-reels = "creador_reels.cli:main"

[tool.setuptools]
packages = ["creador_reels"]
